<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t">
<title id="t">Bytes on the wire: whole-file push against delta push, to scale</title>
<text x="24.00" y="30.00" font-size="16" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">Bytes on the wire after a small edit to a 64 MiB file</text>
<text x="24.00" y="52.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Median of 48 whole-file and 48 delta pushes (every delay x loss point); TCP payload in both directions. The delta resends 8,192 B of literal data.</text>
<text x="166.00" y="110.00" font-size="13" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end" font-weight="600">Whole-file push</text>
<rect x="180.00" y="92.00" width="540.00" height="26.00" fill="#b45309" rx="3"/>
<text x="710.00" y="110.00" font-size="13" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">67,116,804 B sent</text>
<text x="730.00" y="110.00" font-size="12" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">+ 116 B back</text>
<text x="166.00" y="160.00" font-size="13" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end" font-weight="600">Delta push</text>
<rect x="180.00" y="142.00" width="1.41" height="26.00" fill="#6e7781"/>
<rect x="180.00" y="142.00" width="0.25" height="26.00" fill="#b45309"/>
<text x="193.41" y="160.00" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">175,253 B in both directions: 0.26 % of the bar above</text>
<line x1="180.00" y1="168.00" x2="180.00" y2="236.00" stroke="#57606a" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="181.41" y1="168.00" x2="323.00" y2="236.00" stroke="#57606a" stroke-width="1" stroke-dasharray="3,3"/>
<text x="335.00" y="254.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the delta push, 100 x wider</text>
<rect x="180.00" y="236.00" width="131.94" height="26.00" fill="#6e7781" rx="3"/>
<rect x="313.94" y="236.00" width="9.07" height="26.00" fill="#b45309" rx="3"/>
<text x="245.97" y="254.00" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">163,983 B back</text>
<text x="180.00" y="282.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">back from the receiver: signature 163,853 B, plus HELLO, RESUME and OK</text>
<line x1="318.47" y1="232.00" x2="318.47" y2="214.00" stroke="#57606a" stroke-width="1"/>
<text x="324.47" y="212.00" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">11,270 B sent: delta 10,866 B, of which 8,192 B literal</text>
<rect x="24.00" y="312.00" width="14.00" height="14.00" fill="#b45309" rx="2"/>
<text x="44.00" y="323.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">file data sent by the sender</text>
<rect x="240.00" y="312.00" width="14.00" height="14.00" fill="#6e7781" rx="2"/>
<text x="260.00" y="323.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">sent back by the receiver (signature and control frames)</text>
</svg>
