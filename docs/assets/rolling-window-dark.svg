<text x="36.00" y="228.00" font-size="12" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">slide one byte; the byte that leaves the window joins the pending LITERAL</text>
<rect x="16.00" y="244.00" width="14.00" height="14.00" fill="#1a9d8f" rx="2"/>
<text x="36.00" y="256.00" font-size="12" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">weak hit</text>
<text x="36.00" y="274.00" font-size="12" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">SHA-256 the window; if it matches the block's strong sum, emit COPY</text>
<text x="36.00" y="290.00" font-size="12" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">and jump a whole block ahead</text>
<text x="16.00" y="316.00" font-size="12" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">weak = a | b &lt;&lt; 16, updated in O(1) per byte; a weak hit is never trusted without SHA-256</text>
