<text x="575.59" y="199.00" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">34,607,169 B sent</text>
<text x="146.00" y="245.00" font-size="13" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end" font-weight="600">Full retry</text>
