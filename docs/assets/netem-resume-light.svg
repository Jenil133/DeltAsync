<text x="160.00" y="512.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Resumed push: 50.1 % of a full retry. Both attempts together: 1,074,853,123 B, 0.1 % more than one uninterrupted push.</text>
<text x="160.00" y="530.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1 GiB file, cut after 50 % of it. 3 runs; resume offsets seen: 534,773,760, 535,822,336.</text>
