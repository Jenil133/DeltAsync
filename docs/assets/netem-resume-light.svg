<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 598" width="880" height="598" role="img" aria-labelledby="t">
<title id="t">Bytes sent after an interruption: resumed push against a full retry</title>
<text x="24.00" y="30.00" font-size="16" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">After an interruption: resume, or send it all again?</text>
<text x="24.00" y="52.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Sender-to-receiver bytes, medians over the runs of each scenario. The cut attempt is what the proxy forwarded before closing the connection.</text>
<text x="24.00" y="96.00" font-size="14" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">64 MiB file, whole-file push cut by the proxy, then pushed again</text>
<text x="146.00" y="153.00" font-size="13" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end" font-weight="600">Cut attempt</text>
