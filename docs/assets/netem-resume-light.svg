<text x="449.97" y="153.00" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">33,554,432 B crossed before the cut</text>
<text x="425.22" y="126.00" font-size="12" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">verified and journaled: 32,505,856 B</text>
