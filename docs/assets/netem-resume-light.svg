<text x="160.00" y="276.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Resumed push: 51.6 % of a full retry. Both attempts together: 68,161,601 B, 1.6 % more than one uninterrupted push.</text>
<text x="160.00" y="294.00" font-size="12" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">64 MiB file, cut after 50 % of it. 48 runs; resume offsets seen: 31,457,280, 32,505,856.</text>
<text x="24.00" y="332.00" font-size="14" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">1 GiB file, no network emulation</text>
